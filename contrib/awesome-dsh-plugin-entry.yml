# 文件名：data/plugins/<owner>__dsh-connect-loomy.yml
# 提交路径：data/plugins/diudiu62__dsh-connect-loomy.yml（只加这一个文件）
url: https://github.com/diudiu62/dsh-connect-loomy
name: diudiu62/dsh-connect-loomy
category: model
icon: https://raw.githubusercontent.com/diudiu62/dsh-connect-loomy/main/icons/icon-180.png
# 预构建包：资产名刻意不带版本号，latest/download/ 才不会在下次发版时静默 404
